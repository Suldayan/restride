<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a0c">
  <meta name="description" content="Record a run, explore your movement, and review your Restride trials.">
  <title>Restride</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <main class="app-main">
      <section id="screen-home" class="screen active" aria-labelledby="home-title">
        <div class="screen-kicker">RESTRIDE <span>·</span> TRAINING</div>
        <div class="screen-heading">
          <div>
            <p class="eyebrow">YOUR TRAINING AT A GLANCE</p>
            <h1 id="home-title">Overview</h1>
          </div>
          <span class="today-date" id="today-date"></span>
        </div>
        <div id="home-overview"></div>
        <section class="home-history">
          <div class="section-heading">
            <div><p class="eyebrow">YOUR ACTIVITY</p><h2>Recent Trials</h2></div>
            <button type="button" class="text-link" data-screen-link="trial">See all <span aria-hidden="true">→</span></button>
          </div>
          <div id="home-trials" class="trial-list"></div>
        </section>
        <div id="home-deviation-trend"></div>
      </section>

      <section id="screen-trial" class="screen" aria-labelledby="trial-screen-title">
        <div class="screen-kicker">RESTRIDE <span>·</span> YOUR HISTORY</div>
        <div class="screen-heading">
          <div><p class="eyebrow">LATEST RUN · CHARTS &amp; SUMMARY</p><h1 id="trial-screen-title">Latest Trial</h1></div>
        </div>
        <div id="trial-details"></div>
      </section>

      <section id="screen-start" class="screen" aria-labelledby="start-title">
        <div class="screen-kicker">RESTRIDE <span>·</span> NEW SESSION</div>
        <div class="screen-heading">
          <div><p class="eyebrow">READY WHEN YOU ARE</p><h1 id="start-title">Start a Trial</h1></div>
        </div>
        <div id="start-controls"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button type="button" class="nav-item active" data-screen-link="home" aria-current="page">
        <span class="nav-icon" aria-hidden="true">⌂</span><span>Home</span>
      </button>
      <button type="button" class="nav-item" data-screen-link="trial">
        <span class="nav-icon" aria-hidden="true">◷</span><span>Trial</span>
      </button>
      <button type="button" class="nav-item" data-screen-link="start">
        <span class="nav-icon nav-plus" aria-hidden="true">＋</span><span>Start</span>
      </button>
    </nav>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.3.0/chart.umd.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
